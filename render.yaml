# Jerry MLB Prediction Lab — one-click deploy to Render.
#
#   https://render.com/deploy?repo=https://github.com/AltecBX/MLBPredictionLab
#
# Three resources, all on plans that are genuinely free: Postgres, the
# read-only API, and the Next.js web app.
#
# What is deliberately NOT here, and why:
#
#   * No cron job. Render does not offer a free plan for cron jobs, and one in
#     this file would fail the whole blueprint. The daily refresh runs as a
#     GitHub Actions workflow instead — .github/workflows/refresh.yml — which
#     is free, lives beside the code, and can be triggered from a phone.
#
#   * No Key Value / Redis. Also not free. The backend treats an unset
#     REDIS_URL as "caching disabled" rather than failing, so the only cost is
#     that every request reaches Postgres. At one reader's traffic that is
#     nothing.
#
# Read DEPLOYMENT.md before relying on this. Two Render free-tier facts matter
# enough to repeat here: services sleep after 15 minutes idle and take about a
# minute to wake, and a free Postgres instance expires 30 days after creation.

databases:
  - name: jerry-db
    plan: free
    databaseName: jerry_mlb
    user: jerry
    # 1 GB. Four seasons of raw payloads measure 908 MB and do not leave room;
    # two seasons are about 460 MB. DEPLOYMENT.md § Sizing has the breakdown.

services:
  # ------------------------------------------------------------------ api
  # Read-only. It never trains and never computes a prediction inside a GET —
  # predictions are rows written by the refresh workflow — so it needs no model
  # artifact and no writable disk.
  - type: web
    name: jerry-api
    runtime: docker
    plan: free
    region: oregon
    # rootDir makes every other path relative to ITSELF, not to the repo root
    # (render.com/docs/monorepo-support: dockerfilePath and dockerContext
    # "operate relative to the root directory"). The blueprint-spec page says
    # "relative to the repo root", which is true only when rootDir is unset —
    # trusting that sentence with rootDir set resolved this to
    # backend/backend/Dockerfile and failed every deploy in nine seconds.
    # dockerContext is omitted deliberately: it defaults to rootDir already.
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: jerry-db, property: connectionString }
      - key: ENVIRONMENT
        value: production
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      # Left blank on purpose: caching is optional and Render Key Value is not
      # free. Blank means "not configured", not "broken".
      - key: REDIS_URL
        value: ""
      # The browser origin of the web app. Fill this in after the first deploy,
      # once Render has assigned jerry-web its URL.
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      # Later-phase providers stay unset on purpose. Each unset variable makes
      # its category report UNAVAILABLE in the UI, naming itself as the fix.
      # Never set one to a fake value to make a screen look complete.
      - key: LINEUP_PROVIDER
        sync: false
      - key: WEATHER_PROVIDER
        sync: false
      - key: STATCAST_PROVIDER
        sync: false
      - key: INJURY_PROVIDER
        sync: false
      - key: PARK_FACTOR_PROVIDER
        sync: false
      - key: ODDS_PROVIDER
        sync: false

  # ------------------------------------------------------------------ web
  - type: web
    name: jerry-web
    runtime: docker
    plan: free
    region: oregon
    # Same rootDir-relative rule as the API above.
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    envVars:
      # The API's PUBLIC hostname, not its private one. A free Render service
      # cannot *receive* private network traffic, so a private address here
      # would refuse the connection. `host` yields a bare hostname; the client
      # normalises that to https://<host>/api/v1.
      - key: API_BASE_URL
        fromService: { name: jerry-api, type: web, property: host }
      - key: NODE_ENV
        value: production
