[project]
name = "jerry-mlb-prediction-lab"
version = "1.0.0"
description = "Transparent, historically validated MLB win probabilities."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "alembic==1.14.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "httpx==0.28.1",
    "redis==5.2.1",
    "pandas==2.2.3",
    "numpy==2.2.1",
    "scikit-learn==1.6.0",
    "structlog==24.4.0",
    "tenacity==9.0.0",
    "python-dotenv==1.0.1",
    "orjson==3.10.13",
]

[project.optional-dependencies]
# Phase 2/3 modelling stack. Not required to run Phase 1.
ml = [
    "lightgbm==4.5.0",
    "xgboost==2.1.3",
    "optuna==4.1.0",
    "shap==0.46.0",
]
# Error tracking is honoured when SENTRY_DSN is set; absent it is a no-op.
observability = ["sentry-sdk==2.19.2"]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "ruff==0.8.6",
    "mypy==1.14.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:sklearn.*",
    "ignore::ResourceWarning",
]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
plugins = []
