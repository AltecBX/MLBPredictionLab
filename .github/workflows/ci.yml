name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jerry
          POSTGRES_PASSWORD: jerry
          POSTGRES_DB: jerry_mlb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jerry" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://jerry:jerry@localhost:5432/jerry_mlb
      REDIS_URL: ""
      CACHE_ENABLED: "false"
      ENVIRONMENT: test
      LOG_FORMAT: json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check app tests
      - name: Migrations apply cleanly
        working-directory: backend
        run: alembic upgrade head
      - name: Tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q

  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Component tests
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: End-to-end (layout and iPhone contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build
        working-directory: frontend
        run: npm run build
      # No API here on purpose. Every page renders an explicit unavailable
      # state without one, and a layout that breaks on a phone breaks in that
      # state too — the overflow and touch-target assertions still run. Tests
      # that genuinely need a seeded slate skip themselves and say so.
      - name: End-to-end
        working-directory: frontend
        env:
          CI: "true"
          API_BASE_URL: http://127.0.0.1:9/api/v1
        run: npx playwright test --reporter=list
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  images:
    name: Container images build and serve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # These are what Render actually runs. Both previously shipped bugs that
      # only appear in a container — an npm flag that stripped the build's
      # native compilers, and a hard-coded port a host would never use — and
      # neither was reachable from any other test.
      - name: Build the API image
        run: docker build -f ./backend/Dockerfile ./backend -t jerry-api:ci

      - name: Build the web image
        run: docker build -f ./frontend/Dockerfile ./frontend -t jerry-web:ci

      # The port the host assigns, not the one the Dockerfile happens to EXPOSE.
      - name: The web image serves on a host-assigned port
        run: |
          docker run -d --name web -p 10000:10000 -e PORT=10000 jerry-web:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:10000/manifest.webmanifest; then
              echo "serving on the assigned port"; exit 0
            fi
            sleep 2
          done
          echo "::error::The web image never served on PORT=10000."
          docker logs web
          exit 1

      # A build that quietly drops SWC or oxide still produces an image; it just
      # produces one with no CSS and no compiled pages. Assert the output exists.
      - name: The build actually produced compiled output
        run: |
          docker run --rm jerry-web:ci sh -c '
            test -f server.js || { echo "::error::no standalone server.js"; exit 1; }
            ls .next/static/css/*.css >/dev/null 2>&1 || { echo "::error::no compiled CSS — Tailwind oxide was likely missing"; exit 1; }
            echo "server.js and compiled CSS present"
          '

      # Playwright and Vitest in a public-facing image is how a 1.8 GB container
      # happens. Standalone output is what keeps them out; prove it stays that way.
      - name: The runtime image carries no test toolchain
        run: |
          docker run --rm jerry-web:ci sh -c '
            for p in @playwright vitest jsdom @testing-library; do
              if [ -e "node_modules/$p" ]; then echo "::error::$p is in the runtime image"; exit 1; fi
            done
            echo "runtime image is clean"
          '
