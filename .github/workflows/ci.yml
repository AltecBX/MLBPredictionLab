name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jerry
          POSTGRES_PASSWORD: jerry
          POSTGRES_DB: jerry_mlb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jerry" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://jerry:jerry@localhost:5432/jerry_mlb
      REDIS_URL: ""
      CACHE_ENABLED: "false"
      ENVIRONMENT: test
      LOG_FORMAT: json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check app tests
      - name: Migrations apply cleanly
        working-directory: backend
        run: alembic upgrade head
      - name: Tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q

  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Component tests
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: End-to-end (layout and iPhone contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build
        working-directory: frontend
        run: npm run build
      # No API here on purpose. Every page renders an explicit unavailable
      # state without one, and a layout that breaks on a phone breaks in that
      # state too — the overflow and touch-target assertions still run. Tests
      # that genuinely need a seeded slate skip themselves and say so.
      - name: End-to-end
        working-directory: frontend
        env:
          CI: "true"
          API_BASE_URL: http://127.0.0.1:9/api/v1
        run: npx playwright test --reporter=list
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
