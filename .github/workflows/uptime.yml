name: Uptime

# Keeps the deployment warm, and makes a real outage visible.
#
# Two separate problems, one workflow.
#
# **The cold start.** Render's free plan sleeps a service after fifteen minutes
# idle and takes about a minute to wake. For a site read a few times a day that
# means almost every visit is a cold start, and a cold start returns 502 while
# it happens — which is exactly what a reader reported seeing. The client now
# retries through it, but not waking in the first place is better than waking
# gracefully. A request every ten minutes keeps the fifteen-minute idle timer
# from ever expiring.
#
# **The real outage.** When the API is genuinely down — an expired free
# database, a failed deploy — this fails and says so, rather than the first
# notice being somebody opening the site and finding nothing. The API's health
# endpoint is process liveness, so it answers even when the database is
# unreachable; the readiness check below is what distinguishes "running" from
# "actually able to serve data".
#
# WEB_URL defaults to this repository's own deployment, because a keep-warm that
# only works once somebody sets a variable does not keep anything warm — which is
# exactly how the first version of this failed. Override either URL with a
# repository variable (Settings → Secrets and variables → Actions → Variables).
#
# Pinging the web app is what matters most: every page is server-rendered and
# fetches the API, so one request to the front page wakes BOTH services. API_URL
# is optional and only adds the readiness check, which is the one that can tell
# a running API from one whose database has gone.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  ping:
    name: Keep warm and check health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_URL: ${{ vars.API_URL }}
      WEB_URL: ${{ vars.WEB_URL || 'https://jerry-web.onrender.com' }}
    steps:
      - name: Report what will be checked
        id: guard
        run: |
          echo "WEB_URL=$WEB_URL"
          echo "API_URL=${API_URL:-(unset; readiness check skipped)}"
          if [ -z "$WEB_URL" ] && [ -z "$API_URL" ]; then
            echo "::notice::Both URLs are empty; nothing to check."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # First, and with a generous timeout: waking IS the normal case here, and
      # a wake taking fifty seconds is a healthy free-tier service rather than an
      # outage. This request also wakes the API, because the page it renders
      # fetches it server-side.
      - name: Wake the web app
        if: steps.guard.outputs.configured == 'true' && env.WEB_URL != ''
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
                   --max-time 120 --retry 4 --retry-delay 10 --retry-all-errors \
                   "${WEB_URL%/}/" || echo 000)
          echo "GET / -> $code"
          if [ "$code" != "200" ]; then
            echo "::error::The web app did not answer (status $code)."
            exit 1
          fi

      - name: Wake the API
        if: steps.guard.outputs.configured == 'true' && env.API_URL != ''
        run: |
          code=$(curl -sS -o /tmp/health.txt -w '%{http_code}' \
                   --max-time 90 --retry 3 --retry-delay 5 --retry-all-errors \
                   "${API_URL%/}/health" || echo 000)
          echo "GET /health -> $code"
          head -c 300 /tmp/health.txt || true
          if [ "$code" != "200" ]; then
            echo "::error::The API did not answer /health (status $code). The" \
                 "service is not running: check the Render dashboard for a" \
                 "failed deploy, and DEPLOYMENT.md for the free-database" \
                 "expiry, which is the usual cause."
            exit 1
          fi

      # /health is liveness and answers with no database at all. This one asks
      # whether the API can actually serve, so a database that has expired or
      # gone unreachable surfaces here rather than on the reader's screen.
      - name: Check the API can reach its data
        if: steps.guard.outputs.configured == 'true' && env.API_URL != ''
        run: |
          code=$(curl -sS -o /tmp/ready.json -w '%{http_code}' \
                   --max-time 90 --retry 2 --retry-delay 5 --retry-all-errors \
                   "${API_URL%/}/api/v1/diagnostics/health" || echo 000)
          echo "GET /api/v1/diagnostics/health -> $code"
          head -c 500 /tmp/ready.json || true
          if [ "$code" != "200" ]; then
            echo "::error::The API is running but cannot serve data (status" \
                 "$code). The process is up and its database is not."
            exit 1
          fi
          # Specifically the database. The cache reports reachable=false too
          # whenever REDIS_URL is blank, which render.yaml does on purpose --
          # matching on the bare field would fail every run of a healthy
          # deployment.
          if [ "$(jq -r '.database.reachable' /tmp/ready.json)" != "true" ]; then
            echo "::error::The API is up but reports its database as" \
                 "unreachable. Predictions cannot be read. DEPLOYMENT.md" \
                 "§ Sizing covers the free-database expiry, which is the" \
                 "usual cause."
            exit 1
          fi

