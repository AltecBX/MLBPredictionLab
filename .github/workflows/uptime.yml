name: Uptime

# Makes a real outage visible.
#
# The site is static files on GitHub Pages, so nothing in the read path can be
# down in the ordinary sense. What CAN happen — and did, for three days — is
# that every job that refreshes and republishes it fails, and the site keeps
# serving its last build with nobody the wiser, because a static page cannot
# say it is stale. This checks the one thing that distinguishes "publishing"
# from "frozen": the build stamp pages.yml writes into the site.
#
# Hourly rather than every ten minutes. GitHub throttles scheduled workflows
# regardless of the cron, and a stamp that is refreshed at most hourly does not
# need reading more often than that.
#
# The earlier version of this workflow kept a Render deployment warm. There is
# no Render deployment in the read path any more; DEPLOYMENT.md path 0.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  check:
    name: Is the site still publishing?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      # The daily refresh publishes around 09:30 UTC and the pregame poller
      # through the evening. A stamp older than this means at least one whole
      # daily cycle has been missed.
      MAX_AGE_HOURS: "30"
    steps:
      - name: Read the build stamp
        run: |
          set -euo pipefail
          url="${SITE_URL%/}/build.json"
          echo "Checking $url"
          if ! body=$(curl -sS --fail --max-time 20 -H 'Cache-Control: no-cache' "$url"); then
            echo "::error::The site did not serve build.json. Either it has never been published since the stamp was introduced, or Pages is down."
            exit 1
          fi
          echo "$body"
          built_at=$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin)["built_at"])')
          age_hours=$(( ( $(date -u +%s) - $(date -u -d "$built_at" +%s) ) / 3600 ))
          echo "Built $built_at, ${age_hours}h ago"
          if [ "$age_hours" -gt "$MAX_AGE_HOURS" ]; then
            echo "::error::The site was last built ${age_hours} hours ago (limit ${MAX_AGE_HOURS}h). The refresh or publish workflows are failing; check the Actions tab."
            exit 1
          fi

      - name: Check the front page renders a slate
        run: |
          set -euo pipefail
          html=$(curl -sS --fail --max-time 20 "${SITE_URL%/}/")
          if ! printf '%s' "$html" | grep -q 'Primary'; then
            echo "::error::The front page came back without its navigation; the export is broken."
            exit 1
          fi
