name: Daily refresh

# The scheduler. Replaces the Render cron job in render.yaml, which could not
# run on the free plan, and runs against a database that lives here too.
#
# THE DATABASE IS A RELEASE ASSET. There is no hosted Postgres any more: the
# free instance this ran against expired thirty days after it was created and
# every refresh and publish failed for three days before anyone could tell,
# because the site is static and kept serving the last build. So each job now
# starts its own Postgres service container, restores the latest dump from the
# repository's `data` release (`.github/actions/db-restore`), does its work,
# and saves a new dump back (`.github/actions/db-save`). Nothing expires, no
# secret is needed, and the 1 GB free-tier ceiling that limited the model to
# two seasons of history is gone.
#
# It retrains on every pass rather than only when the model is stale. A runner
# starts with an empty filesystem and `predict` needs a loadable artifact, so
# training in the same job is what puts the artifact there. It is also the
# better default: a model refit on last night's completed games beats
# yesterday's.

on:
  schedule:
    # 09:15 UTC — after every previous-day game is final, before the earliest
    # first pitch of the day.
    - cron: "15 9 * * *"
  workflow_dispatch:
    inputs:
      backtest:
        description: "Also run the walk-forward backtest (fills the Backtest screen; ~15 min)"
        type: boolean
        default: false

concurrency:
  # Shared with the seeder, the pregame poller and the Statcast backfill: every
  # writer restores, writes and saves the same dump, so two must never overlap.
  group: jerry-data
  cancel-in-progress: false

permissions:
  contents: write   # to replace the dump on the `data` release

jobs:
  refresh:
    name: Ingest, retrain, reissue
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jerry
          POSTGRES_PASSWORD: jerry
          POSTGRES_DB: jerry_mlb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jerry -d jerry_mlb" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://jerry:jerry@localhost:5432/jerry_mlb
      ENVIRONMENT: production
      LOG_FORMAT: console
      REDIS_URL: ""
      # Named here because `check-sources` rewrites the Diagnostics source
      # table from these. pregame.yml must agree — a test asserts it.
      LINEUP_PROVIDER: mlb_statsapi
      INJURY_PROVIDER: mlb_statsapi
      WEATHER_PROVIDER: open_meteo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore the data store
        uses: ./.github/actions/db-restore

      # Cheap when there is nothing to apply, and it means a schema change
      # ships with the first refresh after a merge rather than needing a
      # separate step someone has to remember.
      - name: Apply any new migrations
        working-directory: backend
        run: alembic upgrade head

      # Schedule window and missing boxscores, then enforce the raw-payload
      # retention bound.
      #
      # `--skip-predictions` is load-bearing, not tidiness. Predicting requires
      # a trained model, the step that trains one comes after, and on a fresh
      # runner with no loadable artifact this raised and took the retrain down
      # with it.
      - name: Refresh data
        working-directory: backend
        run: python -m app.cli daily --skip-predictions

      # Injured-list moves from the transactions feed. A fortnight rather than
      # a day: a transaction is reported roughly a day after it takes effect,
      # the feed is occasionally amended afterwards, and the upsert is keyed on
      # (player, effective_from, status) so re-reading a window writes nothing
      # new.
      - name: Ingest injured-list moves
        working-directory: backend
        run: |
          END=$(date -u +%F)
          START=$(date -u -d '14 days ago' +%F)
          python -m app.cli ingest-injuries --start "$START" --end "$END"

      - name: Retrain
        working-directory: backend
        run: python -m app.cli train

      - name: Reissue predictions
        working-directory: backend
        run: python -m app.cli predict --force

      - name: Record source freshness
        working-directory: backend
        run: python -m app.cli check-sources

      # Weekly on Mondays, or on request. The Backtest screen and the
      # confidence score's historical-calibration signal both read the most
      # recent run; a week is fresh enough for either.
      - name: Decide whether to backtest
        id: when
        run: echo "dow=$(date -u +%u)" >> "$GITHUB_OUTPUT"

      - name: Backtest
        if: steps.when.outputs.dow == '1' || inputs.backtest == true
        working-directory: backend
        run: python -m app.cli backtest

      - name: Save the data store
        uses: ./.github/actions/db-save

      # A silent scheduler is worse than none: if this has been failing for a
      # week, the site quietly serves week-old predictions with a stale
      # freshness badge and nothing says so.
      - name: Report failure
        if: failure()
        run: |
          {
            echo "### Daily refresh failed"
            echo ""
            echo "The site is now serving whatever predictions were last written, and the"
            echo "Diagnostics screen will show the sources ageing. Re-run this workflow once"
            echo "the cause is fixed."
            echo ""
            echo "If the restore step failed because there is no dump on the \`data\`"
            echo "release, run the **Seed the database** workflow once; it rebuilds the"
            echo "data store from MLB history and saves it there."
          } >> "$GITHUB_STEP_SUMMARY"
