name: Daily refresh

# The scheduler. Replaces the Render cron job in render.yaml, which could not
# be there: Render has no free plan for cron jobs, and including one would fail
# the whole blueprint.
#
# Runs at 09:15 UTC — after every previous-day game has a final boxscore, and
# before the earliest first pitch.
#
# Training runs on every pass rather than only when the model is stale. A CI
# runner starts with an empty filesystem and `predict` loads the pickled model
# from disk, so training in the same job is what puts the artifact there. It is
# also the better default: a model refit on last night's completed games beats
# yesterday's.

on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:

concurrency:
  # Shared with the seed workflow — these two must never write at once.
  group: jerry-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Ingest, retrain, reissue
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ENVIRONMENT: production
      LOG_FORMAT: console
      REDIS_URL: ""
      # These must match `pregame.yml`, and the reason is not tidiness.
      #
      # `check-sources` below recomputes every row of the Diagnostics source
      # table from `configured_categories()`, which reads exactly these
      # variables. Running it in a job that does not set them wrote
      # "No provider configured" over categories that were being ingested
      # successfully every hour: the deployed site reported lineups and weather
      # as UNAVAILABLE on the same screen whose job log showed poll_lineups
      # writing 180 rows and ingest_weather writing 15.
      #
      # That is the failure this product cares about most — UNAVAILABLE means
      # "not measured", and claiming it for something measured is the same lie
      # as the reverse.
      #
      # The pollers themselves construct `MlbStatsApiClient` directly and never
      # consult these, so setting them changes what is *reported* and nothing
      # about what is fetched.
      LINEUP_PROVIDER: mlb_statsapi
      INJURY_PROVIDER: mlb_statsapi
      WEATHER_PROVIDER: open_meteo
    steps:
      - name: Check the database secret is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The DATABASE_URL repository secret is not set. See DEPLOYMENT.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Cheap when there is nothing to apply, and it means a schema change
      # ships with the first refresh after a merge rather than needing a
      # separate step someone has to remember.
      - name: Apply any new migrations
        working-directory: backend
        run: alembic upgrade head

      # Schedule window and missing boxscores, then enforce the raw-payload
      # retention bound.
      #
      # `--skip-predictions` is load-bearing, not tidiness. `daily` used to
      # predict here as well, which the comment this replaces waved off as
      # superseded by the explicit predict below. It was worse than redundant:
      # predicting requires a trained model, the step that trains one comes
      # after, and on a fresh runner with no loadable artifact this raised and
      # took the retrain down with it. Every run of this workflow had failed
      # for that reason.
      - name: Refresh data
        working-directory: backend
        run: python -m app.cli daily --skip-predictions

      # Injured-list moves from the transactions feed. Not in any workflow
      # before this, which is why the production table was empty and the site
      # said "Injuries unavailable" — honestly, but only because nothing was
      # ever fetching them.
      #
      # A fortnight rather than a day. A transaction is reported roughly a day
      # after it takes effect, the feed is occasionally amended afterwards, and
      # the upsert is keyed on (player, effective_from, status) so re-reading a
      # window costs one request and writes nothing new.
      - name: Ingest injured-list moves
        working-directory: backend
        run: |
          END=$(date -u +%F)
          START=$(date -u -d '14 days ago' +%F)
          python -m app.cli ingest-injuries --start "$START" --end "$END"

      - name: Retrain
        working-directory: backend
        run: python -m app.cli train

      - name: Reissue predictions
        working-directory: backend
        run: python -m app.cli predict --force

      - name: Record source freshness
        working-directory: backend
        run: python -m app.cli check-sources

      # A silent scheduler is worse than none: if this has been failing for a
      # week, the site quietly serves week-old predictions with a stale
      # freshness badge and nothing says so.
      - name: Report failure
        if: failure()
        run: |
          {
            echo "### Daily refresh failed"
            echo ""
            echo "The site is now serving whatever predictions were last written, and the"
            echo "Diagnostics screen will show the sources ageing. Re-run this workflow once"
            echo "the cause is fixed."
            echo ""
            echo "First thing to check: a free Render Postgres instance expires 30 days after"
            echo "it is created, and every connection fails once it does."
          } >> "$GITHUB_STEP_SUMMARY"
